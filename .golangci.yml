version: "2"

run:
  # Timeout for total work, e.g. 30s, 5m, 5m30s.
  # If the value is lower or equal to 0, the timeout is disabled.
  # Default: 0 (disabled)
  timeout: 3m

  # Include test files or not.
  # Default: true
  tests: false
linters:
  enable:
    - bodyclose
    - goconst
    - gosec
    - misspell
    - nakedret
    - revive
    - unconvert
    - unparam
  settings:
    goconst:
      min-len: 2
      min-occurrences: 5
    misspell:
      locale: US
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocognit
          - goconst
          - gosec
          - unparam
          - wsl
        path: _test\.go
      - linters:
          - errcheck
          - gocognit
          - goconst
          - gosec
          - unparam
          - wsl
        path: _gen\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
